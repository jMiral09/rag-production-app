readme = "README.md"
authors = [
    { name = "jMiral09", email = "miraljoey291@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "inngest>=0.5.20",
    "llama-index-core>=0.14.26",
    "llama-index-readers-file>=0.8.0",
    "openai>=3.58.0",
    "python-dotenv>=1.2.4",
